name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every platform the desktop app ships on: Windows, Apple Silicon and
        # Intel macOS, and Linux.
        os: [windows-latest, macos-14, macos-15-intel, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Several asset tests drive the JavaScript under Node and skip without it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Electron shell tests
        run: node --test "electron/*.test.js"
