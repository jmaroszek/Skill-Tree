name: Release

# A tag like v1.0.0 builds every installer and opens a draft GitHub Release
# with them and their checksums. Publishing the draft is a person's decision.
#
# A push that touches packaging runs the same builds as a trial: the
# installers are kept as workflow artifacts and nothing is published.
#
# Actions are pinned to a commit, with the release it was in beside it. A
# tag can be moved to other code; a commit can't. This workflow signs and
# publishes, so it runs only code that was reviewed when it was pinned.

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - ".github/workflows/release.yml"
      - "electron/**"
      - "packaging/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Signing secrets must live only in the release-signing environment, whose
    # deployment policy allows protected v* tags. A branch can edit its own
    # workflow, so a job condition alone cannot protect repository secrets.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.name == 'windows-x64' && 'release-signing' || 'trial-build' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: --win --x64 }
          - { name: mac-arm64, os: macos-14, target: --mac --arm64 }
          - { name: mac-x64, os: macos-15-intel, target: --mac --x64 }
          # The oldest supported Ubuntu: the server binary needs the glibc it
          # was built against, so building here lets it run on newer ones.
          - { name: linux-x64, os: ubuntu-22.04, target: --linux --x64 }
    env:
      TAGGED: ${{ startsWith(github.ref, 'refs/tags/v') }}
      WINDOWS_SIGN_COMMAND: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.name == 'windows-x64' && secrets.WINDOWS_SIGN_COMMAND || '' }}
      WINDOWS_SIGN_SETUP: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.name == 'windows-x64' && secrets.WINDOWS_SIGN_SETUP || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # No pip or npm cache. Other runs can write one, and whatever it holds
      # would go into a signed installer. These builds download fresh.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: The tag matches version.py
        if: env.TAGGED == 'true'
        shell: bash
        run: |
          version=$(python -c "from version import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version.py ($version)."
            exit 1
          fi

      # A released Windows installer is always signed; trial builds needn't be.
      - name: Windows signing is configured
        if: runner.os == 'Windows' && env.TAGGED == 'true' && env.WINDOWS_SIGN_COMMAND == ''
        shell: bash
        run: |
          echo "::error::Set the WINDOWS_SIGN_COMMAND secret before tagging a release."
          exit 1

      - name: Install the signing tool
        if: runner.os == 'Windows' && env.TAGGED == 'true' && env.WINDOWS_SIGN_SETUP != ''
        shell: pwsh
        run: Invoke-Expression $env:WINDOWS_SIGN_SETUP

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Install the shell's packages
        working-directory: electron
        run: npm ci

      # Per platform: some Python dependencies are platform-specific. The
      # server's build bundles the file, and Settings > About opens it.
      - name: Write the third-party notices
        run: python packaging/third_party_notices.py

      - name: Build the server
        run: python -m PyInstaller packaging/skilltree-server.spec --noconfirm

      - name: Smoke-test the server
        run: python packaging/smoke_test.py dist/skilltree-server/skilltree-server

      - name: Sign the server
        if: runner.os == 'Windows' && env.TAGGED == 'true'
        run: node electron/build/sign-windows.js dist/skilltree-server/skilltree-server.exe

      - name: Build the installers
        working-directory: electron
        env:
          # macOS: no Developer ID yet, so don't hunt for one (ad-hoc, see
          # electron-builder.yml).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Install Windows package and inspect shortcuts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem electron/dist/Skill-Tree-Setup-*.exe | Select-Object -First 1
          ./packaging/windows_installer_smoke.ps1 -Installer $installer.FullName

      # The copy inside the app is the one users run. On macOS it has been
      # re-signed, which must not have broken it.
      - name: Smoke-test the packaged server
        shell: bash
        run: |
          server=$(find electron/dist -type f \( -name skilltree-server -o -name skilltree-server.exe \) -path "*server/*" | head -n 1)
          echo "Packaged server: $server"
          python packaging/smoke_test.py "$server"

      # The app a user runs, driven the way they would: the window, the
      # welcome, a node saved, quitting, and a second start
      # (packaging/app_journey.py). On Linux it runs on a virtual screen.
      - name: Drive the packaged app
        shell: bash
        run: |
          python -m pip install -r requirements-e2e.txt
          case "$RUNNER_OS" in
            Windows) app=$(find electron/dist -path "*unpacked*" -name "Skill Tree.exe" | head -n 1); flags="" ;;
            macOS)   app=$(find electron/dist -path "*.app/Contents/MacOS/Skill Tree" -type f | head -n 1); flags="" ;;
            Linux)   app=electron/dist/linux-unpacked/skill-tree; flags="--headless"
                     command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; } ;;
          esac
          echo "Packaged app: $app"
          python packaging/app_journey.py "$app" $flags

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.blockmap
            electron/dist/latest.yml
            electron/dist/latest-linux.yml

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: Checksums
        working-directory: installers
        run: sha256sum -- * | tee SHA256SUMS

      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --draft --title "Skill Tree ${GITHUB_REF_NAME#v}" --generate-notes
