[pytest]
# A bare `pytest` runs tests/ but leaves out the browser journeys in
# tests/e2e, which take about ten minutes. Name them to run them:
# pytest tests/e2e. The rest of norecursedirs is pytest's own default,
# which setting it replaces.
testpaths = tests
norecursedirs = e2e .* *.egg _darcs build CVS dist node_modules venv {arch}
# The app's modules sit at the top level, beside tests/. `python -m pytest`
# finds them from the current folder; this lets plain `pytest` find them too.
pythonpath = .
