name: skill-tree
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  # Force the standard (GIL) interpreter + ABI. Without this, conda-forge may
  # resolve to the experimental free-threaded cp313t build, which makes
  # scipy/numpy re-enable the GIL with a RuntimeWarning and is not what base
  # anaconda runs. Keep the env aligned with the standard build.
  - python_abi=3.13=*_cp313
  - dash=4.1.0
  - dash-bootstrap-components=2.0.4
  - networkx=3.4.2
  - numpy=2.2.6
  - plotly=6.6.0
  - pytest=9.0.3
  - scipy=1.15.2
  # Node.js powers the Electron desktop shell (electron/). The shell's own JS
  # dependencies (electron, tree-kill) live in electron/package.json.
  - nodejs=26.3.0
  - pip
  - pip:
    - dash-cytoscape==1.0.2
